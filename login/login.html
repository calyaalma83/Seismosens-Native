<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SeismoSens</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>
    <p class="subtitle">Earthquake Monitoring System</p>

    <!-- Card -->
    <div class="login-card">
      <h3>Masuk ke Akun</h3>
      <p>Gunakan email dan password untuk melanjutkan</p>

      <form onsubmit="return loginUser(event)">
        <div class="form-group">
          <input type="email" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <input type="password" placeholder="Password" required>
        </div>

        <button type="submit" class="login-button">Masuk ke SeismoSens</button>
      </form>

      <div class="extra-links">
        <a href="../forgot-password/forgot-pw.html" class="forgot">Lupa Password?</a>
        <p>Belum punya akun? <a href="../register/register.html">Daftar Sekarang</a></p>
      </div>
    </div>
  </div>

  <script src="login.js"></script>
</body>
</html>
