<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SeismoSens</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>
    <p class="subtitle">Earthquake Monitoring System</p>

    <!-- Card -->
    <div class="login-card">
      <h3>Masuk ke Akun</h3>
      <p>Gunakan email dan password untuk melanjutkan</p>

      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="email" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <div class="password-input">
            <input type="password" id="password" placeholder="Masukkan password anda" required>
            <button type="button" id="togglePassword" class="toggle-password">👁️</button>
          </div>
        </div>

        <div id="error-message" class="error-message" style="display: none; color: #e74c3c; margin: 10px 0; padding: 10px; background-color: #fde8e8; border-radius: 4px; font-size: 14px;"></div>

        <button type="submit" id="loginButton" class="login-button">
          <span class="button-text">Masuk ke SeismoSens</span>
          <span class="button-loader" style="display: none;">🔄</span>
        </button>
      </form>

      <div class="extra-links">
        <a href="/forgot-password/forgot-pw.html" class="forgot">Lupa Password?</a>
        <p>Belum punya akun? <a href="/register/register.html">Daftar Sekarang</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { 
      getAuth, 
      signInWithEmailAndPassword,
      onAuthStateChanged
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD07M2-79Yh0CzotaQeGYYy4WLZoevTdWY",
      authDomain: "seismosens-a048e.firebaseapp.com",
      projectId: "seismosens-a048e",
      storageBucket: "seismosens-a048e.appspot.com",
      messagingSenderId: "358453169511",
      appId: "1:358453169511:web:fccc32bf22ede39ff0b3c2"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    console.log('Firebase initialized');

    // Check if user is already logged in
    onAuthStateChanged(auth, (user) => {
      if (user) {
        // User is signed in, redirect to home page
        window.location.href = '/seismosens.html';
      }
    });

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const type = passwordInput.getAttribute('type') === 'password' ? 'text' : 'password';
      passwordInput.setAttribute('type', type);
      this.textContent = type === 'password' ? '👁️' : '👁️‍🗨️';
    });

    // Handle form submission
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      const loginButton = document.getElementById('loginButton');
      const buttonText = loginButton.querySelector('.button-text');
      const buttonLoader = loginButton.querySelector('.button-loader');
      const errorElement = document.getElementById('error-message');
      
      // Reset error message
      errorElement.style.display = 'none';
      
      // Show loading state
      buttonText.textContent = 'Memproses...';
      buttonLoader.style.display = 'inline-block';
      loginButton.disabled = true;
      
      try {
        console.log('Attempting to sign in...');
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        console.log('User signed in:', userCredential.user.uid);
        
        // Show success message before redirect
        buttonText.textContent = 'Berhasil! Mengarahkan...';
        
        // Small delay to show success message
        await new Promise(resolve => setTimeout(resolve, 1000));
        
        window.location.href = '/seismosens.html';
      } catch (error) {
        console.error('Error:', error);
        let errorMessage = 'Login gagal: ';
        
        switch(error.code) {
          case 'auth/user-not-found':
            errorMessage = 'Email tidak terdaftar. Silakan daftar terlebih dahulu.';
            break;
          case 'auth/wrong-password':
            errorMessage = 'Password salah. Silakan coba lagi.';
            break;
          case 'auth/too-many-requests':
            errorMessage = 'Terlalu banyak percobaan login. Akun Anda sementara dinonaktifkan. Silakan coba lagi nanti atau reset password Anda.';
            break;
          case 'auth/invalid-email':
            errorMessage = 'Format email tidak valid.';
            break;
          case 'auth/user-disabled':
            errorMessage = 'Akun ini telah dinonaktifkan. Silakan hubungi administrator.';
            break;
          case 'auth/network-request-failed':
            errorMessage = 'Koneksi internet bermasalah. Silakan periksa koneksi Anda dan coba lagi.';
            break;
          default:
            errorMessage = 'Terjadi kesalahan. Silakan coba lagi nanti.';
            console.error('Login error:', error);
        }
        
        // Show error message
        errorElement.textContent = errorMessage;
        errorElement.style.display = 'block';
        
        // Reset button state
        buttonText.textContent = 'Masuk ke SeismoSens';
        buttonLoader.style.display = 'none';
        loginButton.disabled = false;
        
        // Focus on the first error field
        if (error.code === 'auth/user-not-found' || error.code === 'auth/invalid-email') {
          document.getElementById('email').focus();
        } else if (error.code === 'auth/wrong-password') {
          document.getElementById('password').focus();
        }
      }
    });
  </script>
</body>
</html>
