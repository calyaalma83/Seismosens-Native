<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SeismoSens</title>
  <!-- Favicon Emoji Earth -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./register.css">
</head>
<body>
  <div class="register-container">
    <!-- Logo / Icon -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>

    <!-- Card -->
    <div class="register-card">
      <h3>Buat Akun Baru</h3>
      <p>Bergabung dengan jaringan SeismoSens Indonesia</p>

      <form id="registerForm">
        <div class="form-group">
          <input id="nama" type="text" placeholder="Nama Lengkap" required>
        </div>
        <div class="form-group">
          <input id="email" type="email" placeholder="Email Address" required>
        </div>
        <div class="form-group password-group">
          <input id="password" type="password" placeholder="Password" required>
          <button type="button" class="toggle-password" data-target="password" aria-label="Tampilkan password">👁</button>
        </div>
        
        <div class="form-group password-group">
          <input id="confirmPassword" type="password" placeholder="Konfirmasi Password" required>
          <button type="button" class="toggle-password" data-target="confirmPassword" aria-label="Tampilkan konfirmasi password">👁</button>
        </div>
                

        <label class="checkbox">
          <input type="checkbox" required>
          Saya setuju dengan <a href="#">Syarat & Ketentuan</a>
        </label>

        <button type="submit" class="register-button">Daftar SeismoSens</button>
      </form>
      
      <div style="margin: 8px 0 5px 0;">
        <button onclick="loginWithGoogle()" 
        style="width:100%; background:#f8f9fa; border:1px solid #e0e0e0; padding:10px; border-radius:8px; font-weight:500; cursor:pointer; color:#3c4043; font-size:14px; display:flex; align-items:center; justify-content:center; transition:background-color 0.2s;">
        <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" 
              alt="Google" style="width:18px; margin-right:8px;">
        Lanjutkan dengan Google
        </button>
      </div>

      <p class="login-text">
        Sudah punya akun? <a href="./login.html">Masuk</a>
      </p>
    </div>
  </div>

  <!-- Pastikan ini pakai module -->
  <script type="module" src="./register.js"></script>
</body>
</html>
