<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - SeismoSens</title>
  <!-- Favicon Emoji Earth -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./forgot-pw.css">
</head>
<body>
  <div class="forgot-container">
    <!-- Logo -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>
    <p class="subtitle">Earthquake Monitoring System</p>

    <!-- Card -->
    <div class="forgot-card">
      <h3>Reset Password</h3>
      <p>Masukkan email Anda untuk menerima tautan reset password</p>

      <form onsubmit="return forgotPassword(event)">
        <div class="form-group">
          <input type="email" id="email" placeholder="Email Address" required>
        </div>
        <button type="submit" class="forgot-button">Kirim Link Reset</button>
      </form>

      <div class="extra-links">
        <p>Sudah ingat password? <a href="./login.html">Masuk Sekarang</a></p>
      </div>
    </div>
  </div>

  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { 
      getAuth, 
      sendPasswordResetEmail 
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD07M2-79Yh0CzotaQeGYYy4WLZoevTdWY",
      authDomain: "seismosens-a048e.firebaseapp.com",
      projectId: "seismosens-a048e",
      storageBucket: "seismosens-a048e.appspot.com",
      messagingSenderId: "358453169511",
      appId: "1:358453169511:web:fccc32bf22ede39ff0b3c2"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    console.log('Firebase initialized for password reset');

    // Handle form submission
    window.forgotPassword = async function(e) {
      e.preventDefault();
      const email = document.getElementById('email').value;
      
      try {
        await sendPasswordResetEmail(auth, email);
        alert('Link reset password telah dikirim ke email Anda. Silakan periksa kotak masuk Anda.');
        window.location.href = '/public/login.html';
      } catch (error) {
        console.error('Error:', error);
        let errorMessage = 'Gagal mengirim email reset password: ';
        
        switch(error.code) {
          case 'auth/user-not-found':
            errorMessage += 'Email tidak terdaftar';
            break;
          case 'auth/invalid-email':
            errorMessage += 'Format email tidak valid';
            break;
          default:
            errorMessage += error.message;
        }
        
        alert(errorMessage);
      }
    };
  </script>
</body>
</html>
