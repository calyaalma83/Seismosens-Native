<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Detail Berita</title>
  <link rel="stylesheet" href="news-detail.css" />
  <!-- Favicon Emoji Earth -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
</head>
<body>
  <header class="news-header">
    <h1>Detail Berita</h1>
    <p>Sistem Monitoring SeismoSens</p>
  </header>

  <main class="news-container">
    <!-- Placeholder awal sebelum konten dimuat -->
    <h2 id="news-title" class="loading">⏳ Memuat judul...</h2>
    <p id="news-meta" class="news-meta loading">Menunggu data...</p>
    <article id="news-content" class="news-content loading">Memuat konten berita...</article>

    <a href="seismosens.html" class="btn-back">&larr; Kembali</a>
  </main>

  <!-- ⬇️ load firebase-init.js dulu -->
  <script type="module" src="firebase-init.js"></script>
  <!-- ⬇️ lalu auth.js (karena butuh window._firebase dari firebase-init.js) -->
  <script type="module" src="auth.js"></script>
  <!-- ⬇️ terakhir baru news-detail.js -->
  <script type="module" src="news-detail.js"></script>

  <script>
    // Opsional: update title browser setelah judul berita terisi
    document.addEventListener("DOMContentLoaded", () => {
      const titleEl = document.getElementById("news-title");
      const observer = new MutationObserver(() => {
        if (titleEl.textContent && titleEl.textContent !== "⏳ Memuat judul...") {
          document.title = titleEl.textContent + " | Detail Berita";
          observer.disconnect();
        }
      });
      observer.observe(titleEl, { childList: true });
    });
  </script>
</body>
</html>
