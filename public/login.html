<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SeismoSens</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>
    <p class="subtitle">Earthquake Monitoring System</p>

    <!-- Card -->
    <div class="login-card">
      <h3>Masuk ke Akun</h3>
      <p>Gunakan email dan password untuk melanjutkan</p>

      <form id="loginForm">
        <div class="form-group">
          <input type="email" id="email" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <div class="password-input">
            <input type="password" id="password" placeholder="Masukkan password anda" required>
            <button type="button" id="togglePassword" class="toggle-password">👁️</button>
          </div>
        </div>

        <div id="error-message" class="error-message" style="display: none; color: #e74c3c; margin: 10px 0; padding: 10px; background-color: #fde8e8; border-radius: 4px; font-size: 14px;"></div>

        <button type="submit" id="loginButton" class="login-button">
          <span class="button-text">Masuk ke SeismoSens</span>
          <span class="button-loader" style="display: none;">🔄</span>
        </button>
      </form>

      <div class="extra-links">
        <a href="/forgot-password/forgot-pw.html" class="forgot">Lupa Password?</a>
        <p>Belum punya akun? <a href="./register.html">Daftar Sekarang</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="./login.js"></script>
</body>
</html>
