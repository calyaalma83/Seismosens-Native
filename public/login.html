<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - SeismoSens</title>
   <!-- Favicon Emoji Earth -->
   <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌍</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./login.css">
</head>
<body>
  <div class="login-container">
    <!-- Logo -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>
    <p class="subtitle">Earthquake Monitoring System</p>

    <!-- Card -->
    <div class="login-card">
      <h3>Masuk ke Akun</h3>
      <p>Gunakan email dan password untuk melanjutkan</p>

      <form id="loginForm" onsubmit="return false;">
        <div class="form-group">
          <input type="email" id="email" name="email" autocomplete="username email" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <div class="password-input">
            <input type="password" id="password" name="password" autocomplete="current-password" placeholder="Masukkan password anda" required>
            <button type="button" id="togglePassword" class="toggle-password">👁️</button>
          </div>
        </div>

        <div id="error-message" class="error-message" style="display: none; color: #e74c3c; margin: 10px 0; padding: 10px; background-color: #fde8e8; border-radius: 4px; font-size: 14px;"></div>

        <button type="submit" id="loginButton" class="login-button">
          <span class="button-text">Masuk ke SeismoSens</span>
          <span class="button-loader" style="display: none;">🔄</span>
        </button>

        <div style="margin: 8px 5px 0;">
          <button onclick="loginWithGoogle()" 
          style="width:100%; background:#f8f9fa; border:1px solid #e0e0e0; padding:10px; border-radius:8px; font-weight:500; cursor:pointer; color:#3c4043; font-size:14px; display:flex; align-items:center; justify-content:center; transition:background-color 0.2s;">
          <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" 
                alt="Google" style="width:18px; margin-right:8px;">
          Lanjutkan dengan Google
          </button>
        </div>

      </form>

      <div class="extra-links">
        <a href="/forgot-password/forgot-pw.html" class="forgot">Lupa Password?</a>
      </div>

      <div class="login-footer">
        <p>Belum punya akun? <a href="register.html">Daftar disini</a></p>
      </div>
    </div>
  </div>

  <script type="module" src="./firebase-init.js"></script>
  <script type="module" src="./auth.js"></script>

  <!-- Firebase and Login Scripts -->
  <script type="module" src="./login.js"></script>
  
  <!-- Fallback for older browsers -->
  <script nomodule>
    document.addEventListener('DOMContentLoaded', function() {
      const loginForm = document.getElementById('loginForm');
      if (loginForm) {
        loginForm.addEventListener('submit', function(e) {
          e.preventDefault();
          alert('Please use a modern browser that supports JavaScript modules');
        });
      } else {
        console.error('Login form not found!');
      }
    });
  </script>
</body>
</html>
