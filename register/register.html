<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Seismosens</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="register.css">
</head>
<body>
    <main class="register">
        <div class="header">
            <h1>Seismosens</h1>
            <p>Earthquake Monitoring System</p>
        </div>

        <section class="card">
            <h2>Buat Akun Baru</h2>
            <p>Bergabung dengan jaringan Seismosens Indonesia</p>

            <form id="registerForm">
                <input type="text" id="fullname" placeholder="Nama Lengkap" required>
                <input type="email" id="email" placeholder="Email Address" required>
                <input type="password" id="password" placeholder="Password" required>
                <input type="password" id="confirmPassword" placeholder="Konfirmasi Password" required>

                <label class="checkbox">
                    <input type="checkbox" id="agree" required>
                    Saya setuju dengan <a href="#">Syarat & Ketentuan</a>
                </label>

                <button type="submit">Daftar Seismosens</button>
            </form>

            <p class="switch">
                Sudah punya akun? <a href="login.html">Masuk</a>
            </p>
        </section>
    </main>

    <script src="register.js"></script>
</body>
</html>
