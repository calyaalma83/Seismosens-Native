<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register - SeismoSens</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="register.css">
</head>
<body>
  <div class="register-container">
    <!-- Logo / Icon -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>

    <!-- Card -->
    <div class="register-card">
      <h3>Buat Akun Baru</h3>
      <p>Bergabung dengan jaringan SeismoSens Indonesia</p>

      <form id="registerForm">
        <div class="form-group">
          <input id="nama" type="text" placeholder="Nama Lengkap" required>
        </div>
        <div class="form-group">
          <input id="email" type="email" placeholder="Email Address" required>
        </div>
        <div class="form-group">
          <input id="password" type="password" placeholder="Password" required>
        </div>
        <div class="form-group">
          <input id="confirmPassword" type="password" placeholder="Konfirmasi Password" required>
        </div>

        <label class="checkbox">
          <input type="checkbox" required>
          Saya setuju dengan <a href="#">Syarat & Ketentuan</a>
        </label>

        <button type="submit" class="register-button">Daftar SeismoSens</button>
      </form>

      <p class="login-text">
        Sudah punya akun? <a href="/login/login.html">Masuk</a>
      </p>
    </div>
  </div>

  <!-- Load Firebase SDKs -->
  <script type="module">
    // Import the functions you need from the SDKs you need
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
    import { 
      getAuth, 
      createUserWithEmailAndPassword,
      updateProfile
    } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';

    // Your web app's Firebase configuration
    const firebaseConfig = {
      apiKey: "AIzaSyD07M2-79Yh0CzotaQeGYYy4WLZoevTdWY",
      authDomain: "seismosens-a048e.firebaseapp.com",
      projectId: "seismosens-a048e",
      storageBucket: "seismosens-a048e.appspot.com",
      messagingSenderId: "358453169511",
      appId: "1:358453169511:web:fccc32bf22ede39ff0b3c2"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    
    console.log('Firebase initialized');

    // Handle form submission
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      
      const nama = document.getElementById('nama').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const confirmPassword = document.getElementById('confirmPassword').value;

      if (password !== confirmPassword) {
        alert('Password dan konfirmasi password tidak sama!');
        return;
      }

      try {
        console.log('Creating user...');
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        
        // Update user profile with display name
        await updateProfile(userCredential.user, {
          displayName: nama
        });
        
        console.log('User created successfully:', userCredential.user.uid);
        window.location.href = '/seismosens.html';
      } catch (error) {
        console.error('Error:', error);
        let errorMessage = 'Registrasi gagal: ';
        
        switch(error.code) {
          case 'auth/email-already-in-use':
            errorMessage += 'Email sudah terdaftar';
            break;
          case 'auth/weak-password':
            errorMessage += 'Password terlalu lemah, minimal 6 karakter';
            break;
          case 'auth/invalid-email':
            errorMessage += 'Format email tidak valid';
            break;
          default:
            errorMessage += error.message;
        }
        
        alert(errorMessage);
      }
    });
  </script>
  <script type="module" src="register.js"></script>
</body>
</html>
