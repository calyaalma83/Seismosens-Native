<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Lupa Password - SeismoSens</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="forgot-pw.css">
</head>
<body>
  <div class="forgot-container">
    <!-- Logo -->
    <div class="logo">🟠</div>
    <h2 class="app-title">SeismoSens</h2>
    <p class="subtitle">Earthquake Monitoring System</p>

    <!-- Card -->
    <div class="forgot-card">
      <h3>Reset Password</h3>
      <p>Masukkan email Anda untuk menerima tautan reset password</p>

      <form onsubmit="return forgotPassword(event)">
        <div class="form-group">
          <input type="email" id="email" placeholder="Email Address" required>
        </div>
        <button type="submit" class="forgot-button">Kirim Link Reset</button>
      </form>

      <div class="extra-links">
        <p>Sudah ingat password? <a href="../login/login.html">Masuk Sekarang</a></p>
      </div>
    </div>
  </div>

  <script src="forgot-pw.js"></script>
</body>
</html>
